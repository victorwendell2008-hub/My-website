<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Website Structure</title>
    <!-- Linking the external CSS file -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Header containing logo and navigation -->
    <header>
        <div class="logo">MyWebsite</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Primary content -->
        <section class="content-area">
            <article>
                <h1>Welcome to Our Site</h1>
                <p>This is the main content area where your primary information lives.</p>
            </article>
        </section>

        <!-- Sidebar for secondary information -->
        <aside class="sidebar">
            <h3>Quick Links</h3>
            <p>Additional widgets or links can go here.</p>
        </aside>
    </main>

    <!-- Footer containing copyright or fine print -->
    <footer>
        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>

</body>
</html>
